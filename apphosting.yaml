# Firebase App Hosting — configuração do backend (ImpressA4 / DMS Print).
# Docs: https://firebase.google.com/docs/app-hosting/configure-github
#
# runConfig controla o Cloud Run por trás do backend:
#  - minInstances: 0 → escala a zero quando ocioso (no Blaze, sem uso = sem custo)
#  - concorrência 80 por instância é o padrão saudável para Node/Next
runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512
  concurrency: 80

# Variáveis de ambiente disponíveis em BUILD e/ou RUNTIME.
# NÃO colocar segredos aqui — chaves de API entram como "secret" (Secret Manager).
#
# IA da restauração (Google Gemini / AI Studio):
#  1. Crie a chave em https://aistudio.google.com/apikey
#  2. Crie o segredo e conceda acesso ao backend:
#       npx firebase-tools apphosting:secrets:set GEMINI_API_KEY --project <PROJETO>
#     (ou Secret Manager no console + papel secretmanager.secretAccessor para
#      a conta de serviço do backend, exibida nos detalhes dele)
#  3. O rollout seguinte já nasce com GEMINI_API_KEY no ambiente de RUNTIME.
#  Opcional: variável GEMINI_IMAGE_MODEL para trocar o modelo (padrão
#  gemini-2.5-flash-image) sem alterar código.
#  2026-10-29: IDs "GA" (gemini-2.5-flash-image, gemini-3.1-flash-lite-image)
#  exigem billing (HTTP 402). gemini-2.5-flash-image-preview = 404 (aposentado).
#  Próximo candidato: gemini-nano-banana-2.1 (painel ai.dev/rate-limit: 100 RPM /
#  1K RPD; mais novo da família, tipografia melhorada).
env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_IMAGE_MODEL
    value: gemini-3.1-flash-image-preview
    availability:
      - RUNTIME
